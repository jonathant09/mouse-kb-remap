name: build

# Every push and pull request: tests, lints and builds on Windows and Linux.
# Pushing a version tag (v0.3.0) also publishes a GitHub release with the
# ready-to-run Windows downloads (see docs/building.md#cutting-a-release).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (release)
        shell: pwsh
        run: |
          cargo build --release --locked 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Surface compiler errors/warnings as annotations on the commit, so they
      # are visible without opening the full log.
      - name: Annotate compiler output
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { exit 0 }
          $text = (Get-Content build.log -Raw) -replace "`r", ''
          foreach ($m in [regex]::Matches($text, '(?ms)^(error|warning)(\[\w+\])?:.*?(?=^\S|\z)')) {
            $kind = if ($m.Value.StartsWith('error')) { 'error' } else { 'warning' }
            $msg = $m.Value.Trim() -replace '%', '%25' -replace "`n", '%0A'
            Write-Output "::${kind} title=rustc::$msg"
          }

      # What users download: one exe that runs on its own (the C runtime is
      # linked in, see .cargo/config.toml), and a zip of a folder holding it.
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $exe = 'target/release/mouse-kb-remap.exe'
          $reported = (& $exe --version | Out-String).Trim()
          if ($reported -ne "mouse-kb-remap $version") { throw "the exe reports '$reported', expected $version" }
          New-Item -ItemType Directory -Force dist/mouse-kb-remap | Out-Null
          Copy-Item $exe, LICENSE dist/mouse-kb-remap/
          Compress-Archive -Path dist/mouse-kb-remap -DestinationPath "dist/mouse-kb-remap-$version-windows-x64.zip" -Force
          Copy-Item $exe dist/mouse-kb-remap.exe

      - uses: actions/upload-artifact@v5
        with:
          name: mouse-kb-remap-windows-x64
          path: |
            dist/*.zip
            dist/mouse-kb-remap.exe
          if-no-files-found: error

  # The Linux backend is experimental: built and unit-tested here, not released.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v5
        with:
          name: mouse-kb-remap-linux-x64-experimental
          path: target/release/mouse-kb-remap

  # Tag v0.3.0 -> release "mouse-kb-remap 0.3.0", notes from that version's
  # CHANGELOG.md section, Windows downloads attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish release assets
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: mouse-kb-remap-windows-x64
          path: assets

      - name: The tag names the version being built
        run: |
          tag="${{ github.ref_name }}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Create the release, or attach the builds to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          ls -l assets
          if gh release view "$tag" > /dev/null 2>&1; then
            # Written by hand already: keep its notes, replace builds of the same name.
            gh release upload "$tag" assets/*.zip assets/mouse-kb-remap.exe --clobber
          else
            bash scripts/release-notes.sh "$version" > notes.md
            gh release create "$tag" assets/*.zip assets/mouse-kb-remap.exe \
              --title "mouse-kb-remap $version" \
              --notes-file notes.md \
              --verify-tag
          fi
