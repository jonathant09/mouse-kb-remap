name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (release)
        shell: pwsh
        run: |
          cargo build --release --locked 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Surface compiler errors/warnings as annotations on the commit, so they
      # are visible without opening the full log.
      - name: Annotate compiler output
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { exit 0 }
          $text = (Get-Content build.log -Raw) -replace "`r", ''
          foreach ($m in [regex]::Matches($text, '(?ms)^(error|warning)(\[\w+\])?:.*?(?=^\S|\z)')) {
            $kind = if ($m.Value.StartsWith('error')) { 'error' } else { 'warning' }
            $msg = $m.Value.Trim() -replace '%', '%25' -replace "`n", '%0A'
            Write-Output "::${kind} title=rustc::$msg"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/mouse-kb-remap.exe dist/
          Copy-Item README.md, LICENSE, start.bat dist/
          Compress-Archive -Path dist/* -DestinationPath mouse-kb-remap-windows-x64.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: mouse-kb-remap-windows-x64
          path: |
            dist/
            mouse-kb-remap-windows-x64.zip

  # The Linux backend is experimental: built and unit-tested here.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v5
        with:
          name: mouse-kb-remap-linux-x64-experimental
          path: target/release/mouse-kb-remap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish release assets
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: mouse-kb-remap-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mouse-kb-remap.exe
            mouse-kb-remap-windows-x64.zip
          generate_release_notes: true
