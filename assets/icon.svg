<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- mouse-kb-remap app icon: a mouse and a keycap on an indigo tile, with a
       remap arrow on the key. Rendered to assets/*.png and assets/icon.ico by
       tools/render-icon.mjs. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ea5ff"/>
      <stop offset="0.55" stop-color="#5a74f2"/>
      <stop offset="1" stop-color="#3a52d6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1ff"/>
    </linearGradient>
    <mask id="cut">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="114" y="112" width="112" height="112" rx="30" fill="#000"/>
    </mask>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <path d="M 64 8 H 192 A 56 56 0 0 1 248 64 V 76 C 180 96 76 96 8 76 V 64 A 56 56 0 0 1 64 8 Z"
        fill="#ffffff" opacity="0.10"/>

  <!-- mouse -->
  <g mask="url(#cut)">
    <rect x="46" y="38" width="100" height="152" rx="50" fill="none" stroke="#ffffff" stroke-width="15"/>
    <line x1="96" y1="40" x2="96" y2="70" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <rect x="87" y="68" width="18" height="34" rx="9" fill="#ffffff"/>
  </g>

  <!-- keycap -->
  <rect x="124" y="122" width="92" height="92" rx="22" fill="#d5ddff"/>
  <rect x="133" y="128" width="74" height="68" rx="16" fill="url(#face)"/>
  <!-- remap arrow -->
  <path d="M 150 162 H 186" stroke="#4a63e6" stroke-width="10" stroke-linecap="round"/>
  <path d="M 174 149 L 189 162 L 174 175" fill="none" stroke="#4a63e6" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
